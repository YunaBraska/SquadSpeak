version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: sunday
      time: "00:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      actions-all:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /tests
    target-branch: main
    schedule:
      interval: weekly
      day: sunday
      time: "00:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: ubuntu
        versions: ["> 26.04"]
    groups:
      docker-all:
        patterns: ["*"]
