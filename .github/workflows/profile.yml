name: "Profile Intel audio delivery"
on:
  push:
    branches: [feature/snapshot-release]
    paths: [.github/workflows/profile.yml]
permissions:
  contents: read
jobs:
  profile:
    uses: ./.github/workflows/wc_macos_build.yml
    with:
      ref: ${{ github.sha }}
      version: 0.0.2
      runners: '["macos-15-intel"]'
      prepare_command: sh tests/macos-ci.sh auto build/macos-ci prepare
      build_command: sh tests/macos-ci.sh auto build/macos-ci build
      test_command: |
        python3 - <<'PYPROFILE'
        import pathlib, subprocess, sys
        output = pathlib.Path("build/macos-ci/artifacts")
        output.mkdir(parents=True, exist_ok=True)
        target = pathlib.Path("build/macos-ci/app/channel_tests").resolve()
        profilers = []
        with (output / "profile-test.log").open("w") as log:
            test = subprocess.Popen(["sudo", "-E", str(target),
                "sixtyFourClientsHaveOneConsistentRosterAndAudioFanout"],
                stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
            for line in test.stdout:
                log.write(line)
                log.flush()
                print(line, end="", flush=True)
                if "Starting audio soak" in line:
                    profile = (output / f"sample-{len(profilers)}.txt").resolve()
                    profilers.append(subprocess.Popen(["sudo", "sample", "channel_tests", "10", "1", "-file", str(profile)]))
            result = test.wait()
        for profiler in profilers:
            if profiler.wait() != 0: result = 1
        sys.exit(result)
        PYPROFILE
      package_command: test -s build/macos-ci/artifacts/sample-0.txt
      cache_inputs: '["tests/macos-ci.sh", "cmake/Dependencies.cmake", "cmake/AudioProcessing.cmake", "cmake/Media.cmake", "cmake/Updates.cmake", "cmake/*.patch", "cmake/source_archives.json"]'
      cache_paths: |
        build/macos-ci/toolchain/Qt
        build/macos-ci/dependencies
        build/macos-ci/app/_deps
        build/macos-ci/app/qt-qml
        build/macos-ci/app/squad_qt_qml_build-prefix
        build/macos-ci/app/squad_ffmpeg_build-prefix
        build/macos-ci/app/ffmpeg
        build/macos-ci/app/squad_apm_build-prefix
        build/macos-ci/app/audio-processing
      package_paths: build/macos-ci/artifacts/sample-*.txt
      report_paths: build/macos-ci/artifacts
