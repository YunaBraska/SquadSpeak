name: "Measure Intel host scheduling"
on:
  push:
    branches: [feature/snapshot-release]
    paths: [.github/workflows/profile.yml]
permissions:
  contents: read
jobs:
  audio:
    uses: ./.github/workflows/wc_macos_build.yml
    with:
      ref: ${{ github.sha }}
      version: '2026.10.17'
      runners: '["macos-15-intel"]'
      prepare_command: |
        set -eu
        rustup toolchain install 1.96.0 --profile minimal
        printf '%s\n' "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.cargo/bin:$PATH"
        sh tests/macos-ci.sh auto build/macos-ci prepare
      build_command: sh tests/macos-ci.sh auto build/macos-ci build
      test_command: |
        set -eu
        sudo -n build/macos-ci/app/media_transport_tests delayedOwnerUsesNetworkArrivalTime \
          > build/macos-ci/artifacts/reorder.log 2>&1
        top -l 0 -s 1 -n 12 -o cpu -stats pid,command,cpu,time,threads,state \
          > build/macos-ci/artifacts/system-load.log 2>&1 &
        monitor=$!
        trap 'kill "$monitor" 2>/dev/null || :; git restore -- tests/channel_tests.cpp' EXIT
        result=0
        sudo -n build/macos-ci/app/channel_tests sixtyFourClientsHaveOneConsistentRosterAndAudioFanout \
          > build/macos-ci/artifacts/capacity.log 2>&1 || result=$?
        grep -E 'FAIL|PASS|Totals|64 clients|CPU ms' build/macos-ci/artifacts/capacity.log
        python3 - <<'PYCOMPARE'
        from pathlib import Path
        path = Path('tests/channel_tests.cpp')
        source = path.read_text()
        before = '        Device host(arguments[2], "Host");'
        assert source.count(before) == 1
        path.write_text(source.replace(before,
            '        QThread::currentThread()->setServiceLevel(QThread::QualityOfService::High);\n' + before))
        PYCOMPARE
        cmake --build build/macos-ci/app --target channel_tests --parallel 3
        comparison=0
        sudo -n build/macos-ci/app/channel_tests sixtyFourClientsHaveOneConsistentRosterAndAudioFanout \
          > build/macos-ci/artifacts/host-priority.log 2>&1 || comparison=$?
        grep -E 'FAIL|PASS|Totals|64 clients|CPU ms' build/macos-ci/artifacts/host-priority.log
        printf 'Baseline exit: %s. Host-priority comparison exit: %s.\n' "$result" "$comparison"
        exit "$result"
      package_command: test -s build/macos-ci/artifacts/capacity.log
      cache_inputs: '["tests/macos-ci.sh", "cmake/Dependencies.cmake", "cmake/AudioProcessing.cmake", "cmake/Media.cmake", "cmake/Updates.cmake", "cmake/*.patch", "cmake/source_archives.json", "src/teamspeak_bridge/Cargo.lock", "rust-toolchain.toml", "cmake/TeamSpeak.cmake"]'
      cache_paths: |
        build/macos-ci/toolchain/Qt
        build/macos-ci/dependencies
        build/macos-ci/app/teamspeak
        ~/.cargo/registry
        ~/.cargo/git
        build/macos-ci/app/_deps
        build/macos-ci/app/qt-qml
        build/macos-ci/app/squad_qt_qml_build-prefix
        build/macos-ci/app/squad_ffmpeg_build-prefix
        build/macos-ci/app/ffmpeg
        build/macos-ci/app/squad_apm_build-prefix
        build/macos-ci/app/audio-processing
      package_paths: build/macos-ci/artifacts/*.log
      report_paths: |
        build/macos-ci/artifacts/*.log
