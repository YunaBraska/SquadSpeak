name: "Profile Intel audio delivery"
on:
  push:
    branches: [feature/snapshot-release]
    paths: [.github/workflows/profile.yml]
permissions:
  contents: read
jobs:
  profile:
    uses: ./.github/workflows/wc_macos_build.yml
    with:
      ref: ${{ github.sha }}
      version: 0.0.2
      runners: '["macos-15-intel"]'
      prepare_command: sh tests/macos-ci.sh auto build/macos-ci prepare
      build_command: sh tests/macos-ci.sh auto build/macos-ci build
      test_command: |
        mkdir -p build/macos-ci/artifacts
        sysctl kern.ipc.maxsockbuf net.inet.udp.recvspace net.inet.udp.maxdgram
        netstat -s -p udp
        trap 'netstat -s -p udp' EXIT
        sudo -E build/macos-ci/app/channel_tests sixtyFourClientsHaveOneConsistentRosterAndAudioFanout \
          2>&1 | tee build/macos-ci/artifacts/profile-test.log
      package_command: test -s build/macos-ci/artifacts/profile-test.log
      cache_inputs: '["tests/macos-ci.sh", "cmake/Dependencies.cmake", "cmake/AudioProcessing.cmake", "cmake/Media.cmake", "cmake/Updates.cmake", "cmake/*.patch", "cmake/source_archives.json"]'
      cache_paths: |
        build/macos-ci/toolchain/Qt
        build/macos-ci/dependencies
        build/macos-ci/app/_deps
        build/macos-ci/app/qt-qml
        build/macos-ci/app/squad_qt_qml_build-prefix
        build/macos-ci/app/squad_ffmpeg_build-prefix
        build/macos-ci/app/ffmpeg
        build/macos-ci/app/squad_apm_build-prefix
        build/macos-ci/app/audio-processing
      package_paths: build/macos-ci/artifacts/profile-test.log
      report_paths: build/macos-ci/artifacts
