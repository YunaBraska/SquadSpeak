name: "🔄 CD · Release Snapshot"

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - docs/**
      - doc/**
      - .github/workflows/product-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: squadspeak-merge
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ github.sha }}
      release_mode: snapshot
    secrets: inherit
