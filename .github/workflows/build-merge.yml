name: "🔄 CD · Snapshot"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: squadspeak-merge
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ github.sha }}
      release_mode: snapshot
    secrets: inherit
