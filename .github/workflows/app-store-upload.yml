name: "🛍️ CD · App Store Upload"

on:
  workflow_call:
    inputs:
      version:
        description: Stable marketing version to package and upload.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Existing stable marketing version to package and upload.
        required: true
        type: string

permissions:
  contents: read

jobs:
  macos:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_macos_app_store.yml@be05e1943fb3b026c4e57d1d6f20771b9a3d8628
    with:
      app_name: SquadSpeak
      bundle_id: berlin.yuna.squadspeak
      version: ${{ inputs.version }}
    secrets: inherit

  macos-upload:
    needs: macos
    uses: YunaBraska/YunaBraska/.github/workflows/wc_macos_app_store_upload.yml@be05e1943fb3b026c4e57d1d6f20771b9a3d8628
    with:
      app_name: SquadSpeak
    secrets: inherit

  ios:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_ios_app_store.yml@be05e1943fb3b026c4e57d1d6f20771b9a3d8628
    with:
      app_name: SquadSpeak
      bundle_id: berlin.yuna.squadspeak
      version: ${{ inputs.version }}
    secrets: inherit

  ios-upload:
    needs: ios
    uses: YunaBraska/YunaBraska/.github/workflows/wc_macos_app_store_upload.yml@be05e1943fb3b026c4e57d1d6f20771b9a3d8628
    with:
      app_name: SquadSpeak
      artifact_name: ios-app-store-package
      artifact_extension: ipa
    secrets: inherit
