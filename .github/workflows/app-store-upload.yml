name: "🛍️ CD · App Store Upload"

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing stable marketing version to package and upload.
        required: true
        type: string

permissions:
  contents: read

jobs:
  macos:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_macos_app_store.yml@7574419a0f5ec718f55507d06844613d5fcf920e
    with:
      app_name: SquadSpeak
      bundle_id: berlin.yuna.squadspeak
      version: ${{ inputs.version }}
    secrets: inherit

  macos-upload:
    needs: macos
    uses: YunaBraska/YunaBraska/.github/workflows/wc_macos_app_store_upload.yml@469372e592d87a003dbfae15ef8d50194bcea7e5
    with:
      app_name: SquadSpeak
    secrets: inherit

  ios:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_ios_app_store.yml@7574419a0f5ec718f55507d06844613d5fcf920e
    with:
      app_name: SquadSpeak
      bundle_id: berlin.yuna.squadspeak
      version: ${{ inputs.version }}
    secrets: inherit

  ios-upload:
    needs: ios
    uses: YunaBraska/YunaBraska/.github/workflows/wc_macos_app_store_upload.yml@469372e592d87a003dbfae15ef8d50194bcea7e5
    with:
      app_name: SquadSpeak
      artifact_name: ios-app-store-package
      artifact_extension: ipa
    secrets: inherit
