# yuna-release: true
name: "🏷️ CD · Release"

on:
  workflow_dispatch:
    inputs:
      force:
        description: Release unchanged source. Never replaces a published version.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ github.sha }}
      release_mode: release
      force: ${{ inputs.force }}
    secrets: inherit

  publish:
    needs: verify
    if: needs.verify.outputs.release_mode == 'release'
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      commit_sha: ${{ needs.verify.outputs.commit_sha }}
      version: ${{ needs.verify.outputs.version }}
      release_mode: release
