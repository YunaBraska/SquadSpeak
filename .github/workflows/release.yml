# yuna-release: true
name: "🏷️ CD · Release"

on:
  workflow_dispatch:
    inputs:
      force:
        description: Release unchanged source. Never replaces a published version.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ github.sha }}
      release_mode: release
      force: ${{ inputs.force }}
    secrets: inherit

  app_store_upload:
    needs: verify
    if: needs.verify.outputs.release_mode == 'release'
    uses: ./.github/workflows/app-store-upload.yml
    with:
      version: ${{ needs.verify.outputs.version }}
    secrets: inherit

  publish:
    needs: [verify, app_store_upload]
    if: needs.verify.outputs.release_mode == 'release' && needs.app_store_upload.result == 'success'
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      commit_sha: ${{ needs.verify.outputs.commit_sha }}
      version: ${{ needs.verify.outputs.version }}

  chocolatey:
    needs: [verify, publish]
    if: needs.publish.result == 'success'
    uses: YunaBraska/YunaBraska/.github/workflows/wc_chocolatey_publish.yml@97f62c478daba54a57f8f0150fb45170b4ad5b59
    with:
      package_id: squadspeak
      display_name: SquadSpeak
      version: ${{ needs.verify.outputs.version }}
      release_tag: ${{ needs.verify.outputs.version }}
      asset_name: squadspeak-windows-x86_64.zip
      executable_path: bin/squadspeak.exe
      project_url: https://yunabraska.github.io/SquadSpeak/
      license_expression: GPL-3.0-only
    secrets: inherit
