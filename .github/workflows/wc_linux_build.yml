name: "🐧 CI · Linux Build"

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      version:
        type: string
        required: true
      runner:
        type: string
        default: ubuntu-24.04
      mode:
        type: string
        default: release

permissions:
  contents: read

jobs:
  build:
    name: "🐧 ${{ inputs.runner }} · ${{ inputs.mode }}"
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    env:
      SQUADSPEAK_VERSION: ${{ inputs.version }}
    steps:
      - name: "🧑‍💻 Checkout"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: "🛠️ Setup Container Builder"
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: "📥 Prepare Cached Build Environment"
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: tests
          file: tests/linux.Dockerfile
          target: build
          tags: squadspeak-ci
          load: true
          cache-from: type=gha,scope=linux-${{ runner.arch }}
          cache-to: ${{ inputs.mode == 'release' && format('type=gha,mode=max,scope=linux-{0}', runner.arch) || '' }}
      - name: "📥 Restore Compiler Cache"
        id: compiler-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: build/compiler-cache
          key: compiler-linux-${{ runner.arch }}-${{ inputs.mode }}-${{ hashFiles('tests/linux.Dockerfile') }}-${{ github.sha }}
          restore-keys: compiler-linux-${{ runner.arch }}-${{ inputs.mode }}-${{ hashFiles('tests/linux.Dockerfile') }}-
      - name: "🔨 Build and Test"
        env:
          BUILD_MODE: ${{ inputs.mode }}
        run: |
          set -eu
          mkdir -p build/ci build/compiler-cache
          set --
          case "$BUILD_MODE" in
            release|sanitizers) set -- --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor=unconfined ;;
            store) ;;
            *) printf 'Invalid Linux build mode: %s\n' "$BUILD_MODE" >&2; exit 1 ;;
          esac
          docker run --rm --init "$@" --env SQUADSPEAK_VERSION \
            --env CCACHE_DIR=/compiler-cache --env CCACHE_MAXSIZE=500M --env CTEST_PARALLEL_LEVEL=4 \
            --mount "type=bind,src=$PWD,dst=/source,readonly" \
            --mount "type=bind,src=$PWD/build/ci,dst=/output" \
            --mount "type=bind,src=$PWD/build/compiler-cache,dst=/compiler-cache" squadspeak-ci "$BUILD_MODE"
      - name: "📦 Cache Compiled Objects"
        if: ${{ !cancelled() && steps.compiler-cache.outcome == 'success' && steps.compiler-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: build/compiler-cache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: "🌐 Verify Network Changes"
        run: sh tests/discovery-network.sh build/ci
      - name: "📦 Check Runtime Package"
        env:
          BUILD_MODE: ${{ inputs.mode }}
        run: |
          set -eu
          if test "$BUILD_MODE" = release; then
            docker buildx build --target runtime --load --tag native-ci:runtime \
              --cache-from "type=gha,scope=linux-${{ runner.arch }}" --file tests/linux.Dockerfile tests
            docker run --rm --init --user "$(id -u):$(id -g)" \
              --mount "type=bind,src=$PWD,dst=/source,readonly" \
              --mount "type=bind,src=$PWD/build/ci,dst=/output,readonly" \
              native-ci:runtime sh /source/tests/linux-ci.sh runtime
          else
            test -s build/ci/ctest.xml
            printf 'Verification build: test reports are the artifact.\n'
          fi
      - name: "🧼 Check Sources"
        run: git diff --exit-code
      - name: "📦 Upload Build Artifact"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.mode == 'release' && format('release-linux-{0}', runner.arch) || format('verification-linux-{0}-{1}', runner.arch, inputs.mode) }}
          path: ${{ inputs.mode == 'release' && 'build/ci/squadspeak-linux-*.tar.gz' || 'build/ci' }}
          retention-days: 1
          if-no-files-found: error
      - name: "📋 Upload Test Reports"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-${{ runner.arch }}-${{ inputs.mode }}
          path: |
            build/ci
            !build/ci/squadspeak-linux-*.tar.gz
          retention-days: 7
          if-no-files-found: warn
