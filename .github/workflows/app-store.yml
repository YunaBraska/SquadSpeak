name: "🛍️ CD · App Store"

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing stable marketing version to package.
        required: true
        type: string

permissions:
  contents: read

jobs:
  macos:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_macos_app_store.yml@807b79318cc6e4242e6fc6b4be358b58218d96ab
    with:
      app_name: SquadSpeak
      bundle_id: berlin.yuna.squadspeak
      version: ${{ inputs.version }}
    secrets: inherit

  ios:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_ios_app_store.yml@807b79318cc6e4242e6fc6b4be358b58218d96ab
    with:
      app_name: SquadSpeak
      bundle_id: berlin.yuna.squadspeak
      version: ${{ inputs.version }}
    secrets: inherit
