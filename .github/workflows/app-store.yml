name: "🛍️ CD · App Store"

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing stable marketing version to package.
        required: true
        type: string

permissions:
  contents: read

jobs:
  macos:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_macos_app_store.yml@f122a3096e6ac9b674320772242bc6d47cf396c7
    with:
      app_name: SquadSpeak
      bundle_id: berlin.yuna.squadspeak
      version: ${{ inputs.version }}
    secrets: inherit

  ios:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_ios_app_store.yml@f122a3096e6ac9b674320772242bc6d47cf396c7
    with:
      app_name: SquadSpeak
      bundle_id: berlin.yuna.squadspeak
      version: ${{ inputs.version }}
    secrets: inherit
