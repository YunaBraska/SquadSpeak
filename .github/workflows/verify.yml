name: "🧩 CI · Common Build"

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact source revision.
        type: string
        default: ''
      release_mode:
        description: Build only, publish a snapshot, or resolve a stable release.
        type: string
        default: build
      force:
        description: Release unchanged source. Never replaces a published version.
        type: boolean
        default: false
    secrets:
      MACOS_SIGNING_CERTIFICATE:
        required: false
      MACOS_SIGNING_CERTIFICATE_PASSWORD:
        required: false
      MACOS_NOTARY_KEY:
        required: false
      MACOS_NOTARY_KEY_ID:
        required: false
      MACOS_NOTARY_ISSUER_ID:
        required: false
      SQUADSPEAK_UPDATE_PRIVATE_KEY:
        required: false
    outputs:
      commit_sha:
        description: Tested source revision.
        value: ${{ jobs.prepare.outputs.commit_sha }}
      release_mode:
        description: Build, snapshot, or release after checking branch and source changes.
        value: ${{ jobs.prepare.outputs.release_mode }}
      version:
        description: Version shared by every package.
        value: ${{ jobs.prepare.outputs.version }}

env:
  SQUADSPEAK_UPDATE_PUBLIC_KEY: ${{ vars.SQUADSPEAK_UPDATE_PUBLIC_KEY }}

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ inputs.release_mode == 'snapshot' && github.sha || github.ref }}
  cancel-in-progress: ${{ inputs.release_mode == '' || inputs.release_mode == 'build' }}

jobs:
  prepare:
    name: "🧾 Prepare"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit_sha: ${{ steps.mode.outputs.commit_sha }}
      release_mode: ${{ steps.mode.outputs.release_mode }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: "🧑‍💻 Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: "🛡️ Validate Workflows"
        shell: sh
        run: |
          set -eu
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --connect-timeout 15 --max-time 60 --retry 2 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$archive"
          printf '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  %s\n' "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck=''
      - name: "🛡️ Validate PowerShell Entry Points"
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem tests/*.ps1) {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
          $windows = Get-Content .github/workflows/wc_windows_build.yml -Raw
          $caller = Get-Content .github/workflows/verify.yml -Raw
          $windows += [regex]::Match($caller, '(?ms)^  windows:\r?\n.*?(?=^  sources:)').Value
          $blocks = [regex]::Matches($windows, '(?m)^( +)(?:run|prepare_command): \|\r?\n((?:\1  .*\r?\n|\r?\n)+)')
          if ($blocks.Count -lt 2) { throw "Windows workflow commands were not found" }
          foreach ($block in $blocks) {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseInput($block.Groups[2].Value, [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
      - name: "🛡️ Check release contracts before native builds"
        run: |
          python3 -m unittest discover -s tests -p 'release_*_tests.py'
          python3 tests/test_build_appcasts.py
          python3 tests/source_archive_tests.py
          python3 cmake/build_sources.py --check
          python3 tests/check_dependency_notices.py docs/third-party
          python3 tests/acceptance_tests.py
          python3 tests/process_deadline_tests.py
          for script in tests/*.sh; do sh -n "$script"; done
      - name: "🧾 Read build mode"
        id: mode
        env:
          REQUEST_MODE: ${{ inputs.release_mode || 'build' }}
          FORCE: ${{ inputs.force }}
          SOURCE_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: sh
        run: |
          set -eu
          case "$REQUEST_MODE" in
            build|snapshot|release) ;;
            *) printf 'Unknown release mode: %s\n' "$REQUEST_MODE" >&2; exit 1 ;;
          esac
          commit_sha=$(git rev-parse HEAD)
          git tag --merged HEAD --sort=-creatordate > "$RUNNER_TEMP/reachable-tags.txt"
          latest_tag=$(awk '/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/ { print; exit }' "$RUNNER_TEMP/reachable-tags.txt")
          release_mode=build
          if test "$SOURCE_REF" = "refs/heads/$DEFAULT_BRANCH"; then
            if test "$REQUEST_MODE" = snapshot; then
              release_mode=snapshot
            elif test "$REQUEST_MODE" = release; then
              if test "$FORCE" = true || test -z "$latest_tag"; then
                release_mode=release
              else
                git diff --name-only "$latest_tag" HEAD -- > "$RUNNER_TEMP/changed-files.txt"
                while IFS= read -r path; do
                  case "$path" in
                    README*|*/README*|docs/*|*/docs/*|*.md|.github/*|.editorconfig|.gitignore|LICENSE*|*/LICENSE*|\
                    test/*|tests/*|spec/*|specs/*|Tests/*|*/test/*|*/tests/*|*/spec/*|*/specs/*|\
                    example/*|examples/*|benchmark/*|benchmarks/*|*/example/*|*/examples/*|*/benchmark/*|*/benchmarks/*)
                      ;;
                    *) release_mode=release; break ;;
                  esac
                done < "$RUNNER_TEMP/changed-files.txt"
              fi
            fi
          fi
          {
            printf 'commit_sha=%s\n' "$commit_sha"
            printf 'latest_tag=%s\n' "$latest_tag"
            printf 'release_mode=%s\n' "$release_mode"
          } >> "$GITHUB_OUTPUT"
      - name: "🧾 Read snapshot SemVer"
        id: semver
        uses: YunaBraska/semver-info-action@180ebf79b3c81785c50cf1f198ee236fc5591504
        with:
          semver-a: ${{ steps.mode.outputs.latest_tag }}
          semver-b: 0.0.1
          fallback-semver-a: 0.0.1
          fallback-semver-b: 0.0.1
      - name: "🏷️ Resolve build version"
        id: resolve
        env:
          RELEASE_MODE: ${{ steps.mode.outputs.release_mode }}
          SNAPSHOT_VERSION: ${{ steps.semver.outputs.next_snapshot }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: sh
        run: |
          set -eu
          if test "$RELEASE_MODE" != release; then
            case "$SNAPSHOT_VERSION" in
              *-SNAPSHOT) version="$SNAPSHOT_VERSION.$GITHUB_RUN_ID" ;;
              *) printf 'Missing or invalid snapshot version.\n' >&2; exit 1 ;;
            esac
            cmake "-DSQUADSPEAK_VERSION=$version" -P cmake/Version.cmake
          else
            version=$(cmake -P cmake/Version.cmake 2>&1)
          fi
          if test "$RELEASE_MODE" != build; then
            gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name' > "$RUNNER_TEMP/releases.txt"
            gh api "repos/$GH_REPO/git/matching-refs/tags/$version" --jq '.[].ref' > "$RUNNER_TEMP/tags.txt"
            if grep -Fxq "$version" "$RUNNER_TEMP/releases.txt" || grep -Fxq "refs/tags/$version" "$RUNNER_TEMP/tags.txt"; then
              printf 'Version %s already exists. Published packages are never replaced.\n' "$version" >&2
              exit 1
            fi
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: "🔐 Validate update signing"
        env:
          RELEASE_MODE: ${{ steps.mode.outputs.release_mode }}
          UPDATE_PUBLIC_KEY: ${{ vars.SQUADSPEAK_UPDATE_PUBLIC_KEY }}
          UPDATE_PRIVATE_KEY: ${{ secrets.SQUADSPEAK_UPDATE_PRIVATE_KEY }}
        shell: sh
        run: |
          set -eu
          if test "$RELEASE_MODE" != release; then exit 0; fi
          umask 077
          key="$RUNNER_TEMP/update-key.der"
          trap 'rm -f "$key"' EXIT
          python3 - "$key" <<'PYKEY'
          import base64, os, pathlib, subprocess, sys
          try:
              seed = base64.b64decode(os.environ["UPDATE_PRIVATE_KEY"].strip(), validate=True)
              expected = base64.b64decode(os.environ["UPDATE_PUBLIC_KEY"], validate=True)
          except ValueError:
              raise SystemExit("Update signing keys must use base64")
          if len(seed) != 32 or len(expected) != 32:
              raise SystemExit("Update signing needs a 32-byte private seed and public key")
          key = pathlib.Path(sys.argv[1])
          key.write_bytes(bytes.fromhex("302e020100300506032b657004220420") + seed)
          result = subprocess.run(["openssl", "pkey", "-inform", "DER", "-in", str(key),
                                   "-pubout", "-outform", "DER"], capture_output=True)
          if result.returncode or result.stdout[-32:] != expected:
              raise SystemExit("Update private/public key mismatch")
          PYKEY
      - name: "🛡️ Check unchanged source"
        run: git diff --exit-code
      - name: "🧾 Summarize build"
        env:
          BUILD_VERSION: ${{ steps.resolve.outputs.version }}
          BUILD_COMMIT: ${{ steps.mode.outputs.commit_sha }}
          RELEASE_MODE: ${{ steps.mode.outputs.release_mode }}
        run: |
          printf 'Version: %s\n\nCommit: %s\n\nMode: %s\n' "$BUILD_VERSION" "$BUILD_COMMIT" "$RELEASE_MODE" >> "$GITHUB_STEP_SUMMARY"

  linux:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            mode: release
          - runner: ubuntu-24.04-arm
            mode: release
          - runner: ubuntu-24.04
            mode: store
          - runner: ubuntu-24.04
            mode: sanitizers
    uses: ./.github/workflows/wc_linux_build.yml
    with:
      ref: ${{ needs.prepare.outputs.commit_sha }}
      version: ${{ needs.prepare.outputs.version }}
      runner: ${{ matrix.runner }}
      mode: ${{ matrix.mode }}
      dockerfile: tests/linux.Dockerfile
      context: tests
      image: squadspeak-ci
      cache_dependencies: ${{ matrix.mode == 'release' }}
      cache_inputs: '["tests/linux-ci.sh", "cmake/Dependencies.cmake", "cmake/AudioProcessing.cmake", "cmake/Media.cmake", "cmake/Updates.cmake", "cmake/*.patch", "cmake/source_archives.json", "src/teamspeak_bridge/Cargo.lock", "rust-toolchain.toml", "cmake/TeamSpeak.cmake"]'
      dependency_cache_paths: |
        build/native-cache/teamspeak
        build/native-cache/cargo-cache
        build/native-cache/_deps/qt_capture-*
        build/native-cache/_deps/qt_qml-*
        build/native-cache/qt-capture
        build/native-cache/qt-qml
        build/native-cache/squad_qt_capture_build-prefix
        build/native-cache/squad_qt_qml_build-prefix
      build_command: |
        set -eu
        mkdir -p build/ci build/compiler-cache build/native-cache
        trap 'sudo chown -R "$(id -u):$(id -g)" build/native-cache' EXIT
        set --
        case "$BUILD_MODE" in
          release|sanitizers) set -- --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor=unconfined ;;
          store) ;;
          *) printf 'Invalid Linux build mode: %s\n' "$BUILD_MODE" >&2; exit 1 ;;
        esac
        docker run --rm --init "$@" --env SQUADSPEAK_VERSION="$VERSION" \
          --env CARGO_HOME=/tmp/squadspeak-ci-build/cargo-cache --env CCACHE_DIR=/compiler-cache --env CCACHE_MAXSIZE=500M --env CTEST_PARALLEL_LEVEL=4 \
          --mount "type=bind,src=$PWD,dst=/source,readonly" \
          --mount "type=bind,src=$PWD/build/ci,dst=/output" \
          --mount "type=bind,src=$PWD/build/native-cache,dst=/tmp/squadspeak-ci-build" \
          --mount "type=bind,src=$PWD/build/compiler-cache,dst=/compiler-cache" squadspeak-ci "$BUILD_MODE"
      integration_command: sh tests/discovery-network.sh build/ci
      package_command: |
        set -eu
        if test "$BUILD_MODE" = release; then
          docker buildx build --target runtime --load --tag native-ci:runtime \
            --cache-from "type=gha,scope=linux-$RUNNER_ARCH" --file tests/linux.Dockerfile tests
          docker run --rm --init --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD,dst=/source,readonly" \
            --mount "type=bind,src=$PWD/build/ci,dst=/output,readonly" \
            native-ci:runtime sh /source/tests/linux-ci.sh runtime
        else
          test -s build/ci/ctest.xml
          printf 'Verification build: test reports are the artifact.\n'
        fi
      artifact_prefix: ${{ matrix.mode == 'release' && 'release-linux' || format('verification-linux-{0}', matrix.mode) }}
      package_paths: ${{ matrix.mode == 'release' && 'build/ci/squadspeak-linux-*.tar.gz' || 'build/ci' }}
      report_paths: |
        build/ci
        !build/ci/squadspeak-linux-*.tar.gz

  macos:
    needs: prepare
    uses: ./.github/workflows/wc_macos_build.yml
    with:
      ref: ${{ needs.prepare.outputs.commit_sha }}
      version: ${{ needs.prepare.outputs.version }}
      prepare_command: |
        set -eu
        rustup toolchain install 1.96.0 --profile minimal
        printf '%s\n' "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.cargo/bin:$PATH"
        sh tests/macos-ci.sh auto build/macos-ci prepare
      build_command: sh tests/macos-ci.sh auto build/macos-ci build
      test_command: |
        set -eu
        # Keep realtime load within this shared runner's measured capacity.
        # The independent 72-participant admission contract is unchanged.
        if test "$RUNNER_ARCH" = X64; then export SQUAD_SOAK_CLIENTS=32 SQUAD_SOAK_SPEAKERS=2; fi
        sh tests/macos-ci.sh auto build/macos-ci test
      package_command: sh tests/macos-ci.sh auto build/macos-ci package
      cache_inputs: '["tests/macos-ci.sh", "cmake/Dependencies.cmake", "cmake/AudioProcessing.cmake", "cmake/Media.cmake", "cmake/Updates.cmake", "cmake/*.patch", "cmake/source_archives.json", "src/teamspeak_bridge/Cargo.lock", "rust-toolchain.toml", "cmake/TeamSpeak.cmake"]'
      cache_paths: |
        build/macos-ci/toolchain/Qt
        build/macos-ci/dependencies
        build/macos-ci/app/teamspeak
        ~/.cargo/registry
        ~/.cargo/git
        build/macos-ci/app/_deps
        build/macos-ci/app/qt-qml
        build/macos-ci/app/squad_qt_qml_build-prefix
        build/macos-ci/app/squad_ffmpeg_build-prefix
        build/macos-ci/app/ffmpeg
        build/macos-ci/app/squad_apm_build-prefix
        build/macos-ci/app/audio-processing
      package_paths: |
        build/macos-ci/artifacts/squadspeak-macos-*.zip
        build/macos-ci/artifacts/appcast-macos-*.xml
      report_paths: |
        build/macos-ci/artifacts
        !build/macos-ci/artifacts/squadspeak-macos-*.zip
        !build/macos-ci/artifacts/appcast-macos-*.xml
      sign_updates: ${{ needs.prepare.outputs.release_mode == 'release' }}
      update_public_key: ${{ vars.SQUADSPEAK_UPDATE_PUBLIC_KEY }}
    secrets:
      MACOS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
      MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      UPDATE_PRIVATE_KEY: ${{ secrets.SQUADSPEAK_UPDATE_PRIVATE_KEY }}

  windows:
    needs: prepare
    uses: ./.github/workflows/wc_windows_build.yml
    with:
      ref: ${{ needs.prepare.outputs.commit_sha }}
      version: ${{ needs.prepare.outputs.version }}
      qt_version: '6.11.3'
      qt_modules: qtmultimedia qtimageformats
      prepare_command: |
        rustup toolchain install 1.96.0 --profile minimal
        if ($LASTEXITCODE -ne 0) { throw "Rust toolchain installation failed" }
        python tests/source_archive_tests.py SourceArchiveTests.test_runtime_patches_survive_windows_checkout
        if ($LASTEXITCODE -ne 0) { throw "Windows source checkout changed a patch" }
        $ErrorActionPreference = 'Stop'
        for ($attempt = 1; $attempt -le 3; ++$attempt) {
          choco install nasm --version=3.2.0 --no-progress --yes
          if ($LASTEXITCODE -eq 0) { break }
          if ($attempt -eq 3) { throw "Chocolatey NASM installation failed with exit code $LASTEXITCODE" }
          Start-Sleep -Seconds (5 * $attempt)
        }
        $nasmDir = Join-Path $env:ProgramFiles 'NASM'
        Add-Content -Path $env:GITHUB_PATH -Value $nasmDir
        $env:Path += ";$nasmDir"
        $nasmVersion = & "$nasmDir/nasm.exe" -v
        if ($LASTEXITCODE -ne 0 -or $nasmVersion -notmatch '^NASM version 3\.02(?: |$)') { throw "Unexpected NASM version: $nasmVersion" }
        Write-Host $nasmVersion
        python -m pip install --disable-pip-version-check meson==1.12.1
        if ($LASTEXITCODE -ne 0) { throw "Meson installation failed" }
        ./tests/windows-audio.ps1 -BuildRoot "$env:GITHUB_WORKSPACE/build/windows-ci"
        ./tests/windows-ci.ps1 -QtRoot $env:QT_ROOT_DIR -BuildRoot "$env:GITHUB_WORKSPACE/build/windows-ci" -DependenciesOnly
        Copy-Item "$env:GITHUB_WORKSPACE/build/windows-ci/build.log" "$env:GITHUB_WORKSPACE/build/windows-ci/dependencies-first.log" -Force
        # A restored binary prefix must work without source archives or downloads.
        Get-ChildItem "$env:GITHUB_WORKSPACE/build/windows-ci/dependencies" |
          Where-Object Name -ne 'prefix' | Remove-Item -Recurse -Force
        function global:curl.exe { throw 'Unexpected download while reusing a dependency prefix' }
        try {
          ./tests/windows-ci.ps1 -QtRoot $env:QT_ROOT_DIR -BuildRoot "$env:GITHUB_WORKSPACE/build/windows-ci" -DependenciesOnly
        } finally { Remove-Item Function:\curl.exe }
        Copy-Item "$env:GITHUB_WORKSPACE/build/windows-ci/build.log" "$env:GITHUB_WORKSPACE/build/windows-ci/dependencies-reuse.log" -Force
        if (-not (Select-String -Path build/windows-ci/dependencies-reuse.log -SimpleMatch 'Dependency prefix cache hit' -Quiet)) {
          throw 'Repeated preparation did not reuse the dependency prefix'
        }
        $prefix = "$env:GITHUB_WORKSPACE/build/windows-ci/dependencies/prefix"
        $stamp = "$prefix/.squadspeak-dependencies-ready"
        $original = Get-Content $stamp -Raw
        try {
          Set-Content $stamp 'incompatible inputs' -NoNewline
          & pwsh -NoProfile -File tests/windows-ci.ps1 -QtRoot $env:QT_ROOT_DIR -BuildRoot build/windows-ci -DependenciesOnly *> build/windows-ci/dependencies-mismatch.log
          if ($LASTEXITCODE -eq 0 -or -not (Select-String -Path build/windows-ci/dependencies-mismatch.log -SimpleMatch -Pattern 'stamp does not match' -Quiet)) {
            throw 'Dependency preparation did not reject mismatched inputs'
          }
        } finally { Set-Content $stamp $original -NoNewline -Encoding ascii }
        Move-Item "$prefix/include/openssl/ssl.h" "$prefix/include/openssl/ssl.h.saved"
        try {
          & pwsh -NoProfile -File tests/windows-ci.ps1 -QtRoot $env:QT_ROOT_DIR -BuildRoot build/windows-ci -DependenciesOnly *> build/windows-ci/dependencies-incomplete.log
          if ($LASTEXITCODE -eq 0 -or -not (Select-String -Path build/windows-ci/dependencies-incomplete.log -SimpleMatch -Pattern 'required output is missing' -Quiet)) {
            throw 'Dependency preparation did not reject an incomplete prefix'
          }
        } finally { Move-Item "$prefix/include/openssl/ssl.h.saved" "$prefix/include/openssl/ssl.h" }
        # Both expected child-process failures were validated above.
        $global:LASTEXITCODE = 0
      build_command: ./tests/windows-ci.ps1 -QtRoot $env:QT_ROOT_DIR -BuildRoot "$env:GITHUB_WORKSPACE/build/windows-ci" -Phase build
      test_command: ./tests/windows-ci.ps1 -QtRoot $env:QT_ROOT_DIR -BuildRoot "$env:GITHUB_WORKSPACE/build/windows-ci" -Phase test
      package_command: ./tests/windows-ci.ps1 -QtRoot $env:QT_ROOT_DIR -BuildRoot "$env:GITHUB_WORKSPACE/build/windows-ci" -Phase package
      cache_inputs: '["tests/windows-ci.ps1", "cmake/Dependencies.cmake", "cmake/AudioProcessing.cmake", "cmake/Media.cmake", "cmake/Updates.cmake", "cmake/*.patch", "cmake/source_archives.json", "src/teamspeak_bridge/Cargo.lock", "rust-toolchain.toml", "cmake/TeamSpeak.cmake"]'
      cache_paths: |
        build/windows-ci/dependencies/prefix
        build/windows-ci/app/teamspeak
        ~/.cargo/registry
        ~/.cargo/git
        build/windows-ci/app/_deps
        build/windows-ci/app/qt-qml
        build/windows-ci/app/squad_qt_qml_build-prefix
        build/windows-ci/app/squad_apm_build-prefix
        build/windows-ci/app/audio-processing
      package_paths: build/windows-ci/squadspeak-windows-*.zip
      report_paths: |
        build/windows-ci/*.log
        build/windows-ci/ctest.xml
        build/windows-ci/app/smoke

  sources:
    name: "📚 Dependency Sources"
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: "🧑‍💻 Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          persist-credentials: false
      - name: "📦 Assemble matching third-party sources"
        shell: sh
        run: |
          set -eu
          python3 cmake/build_sources.py --cache "$RUNNER_TEMP/source-cache" \
            --output "$RUNNER_TEMP/source-package/squadspeak-third-party-sources.tar.gz"
      - name: "📦 Preserve source package"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-third-party-sources
          path: "${{ runner.temp }}/source-package/squadspeak-third-party-sources.tar.gz"
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
