[package]
name = "squadspeak-teamspeak-bridge"
version = "0.1.0"
edition = "2021"
build = "build.rs"
license = "GPL-3.0-only"

[lib]
crate-type = ["staticlib"]

[features]
# The local CMake candidate build supplies this feature's extra dependencies.
neural-denoise = []

[dependencies]
audiopus_sys = { version = "0.2.2", features = ["dynamic"] }
base64 = "0.23"
tsclientlib = { git = "https://github.com/ReSpeak/tsclientlib", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5", features = ["audio"] }
tsproto-packets = { git = "https://github.com/ReSpeak/tsclientlib", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "io-util"] }
mumble_protocol = { package = "mumble-protocol-2x", version = "=0.6.0", default-features = false, features = ["tokio-codec"] }
protobuf = "3.7.2"
bytes = "1"
tokio-util = { version = "0.7", features = ["codec", "net"] }
openssl = "0.10"
openssl-sys = "0.9"
tokio-openssl = "0.6"

[profile.dev]
debug = 0
incremental = false

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[build-dependencies]
cc = "1"
